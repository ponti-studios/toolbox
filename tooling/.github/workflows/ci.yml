name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload geo artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/geo
          retention-days: 1

      - name: Upload gimme artifact
        uses: actions/upload-artifact@v4
        with:
          name: gimme-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gimme
          retention-days: 1

      - name: Upload voidline artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidline-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/voidline
          retention-days: 1

      - name: Upload costlens artifact
        uses: actions/upload-artifact@v4
        with:
          name: costlens-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/costlens
          retention-days: 1

      - name: Upload labstools artifact
        uses: actions/upload-artifact@v4
        with:
          name: labstools-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/labstools
          retention-days: 1

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: test
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload geo artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/geo
          retention-days: 1

      - name: Upload gimme artifact
        uses: actions/upload-artifact@v4
        with:
          name: gimme-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gimme
          retention-days: 1

      - name: Upload voidline artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidline-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/voidline
          retention-days: 1

      - name: Upload costlens artifact
        uses: actions/upload-artifact@v4
        with:
          name: costlens-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/costlens
          retention-days: 1

      - name: Upload labstools artifact
        uses: actions/upload-artifact@v4
        with:
          name: labstools-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/labstools
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload geo artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-windows
          path: target/release/geo.exe
          retention-days: 1

      - name: Upload gimme artifact
        uses: actions/upload-artifact@v4
        with:
          name: gimme-windows
          path: target/release/gimme.exe
          retention-days: 1

      - name: Upload voidline artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidline-windows
          path: target/release/voidline.exe
          retention-days: 1

      - name: Upload costlens artifact
        uses: actions/upload-artifact@v4
        with:
          name: costlens-windows
          path: target/release/costlens.exe
          retention-days: 1

      - name: Upload labstools artifact
        uses: actions/upload-artifact@v4
        with:
          name: labstools-windows
          path: target/release/labstools.exe
          retention-days: 1
