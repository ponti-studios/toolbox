[workspace]
resolver = "2"
members = [
    "apps/geo",
    "apps/gimme",
    "apps/voidline",
    "apps/costlens",
    "apps/netdebug",
    "packages/cli-utils",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Charles Ponti"]
repository = "https://github.com/charlesponti/cli-tools"
homepage = "https://github.com/charlesponti/cli-tools"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
cli-utils = { path = "packages/cli-utils" }
walkdir = "2"
refinery = { version = "0.9", features = ["rusqlite", "rusqlite-bundled"] }
