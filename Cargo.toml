[workspace]
resolver = "2"
members = [
    "apps/gitkit",
    "apps/bizkit",
    "apps/filekit",
    "apps/costkit",
    "apps/netkit",
    "packages/files",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Charles Ponti"]
repository = "https://github.com/charlesponti/cli-tools"
homepage = "https://github.com/charlesponti/cli-tools"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
files = { path = "packages/files" }
walkdir = "2"
refinery = { version = "0.9", features = ["rusqlite", "rusqlite-bundled"] }
