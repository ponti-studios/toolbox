[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "timekit"
version = "0.1.0"
description = "Calendar intelligence CLI for local-first Apple Calendar enrichment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Charles Ponti" }]
repository = "https://github.com/charlesponti/cli-tools"
homepage = "https://github.com/charlesponti/cli-tools"
dependencies = [
    "pyobjc-framework-EventKit>=10.0",
    "pyobjc-core>=10.0",
    "typer[all]",
    "aiosqlite",
    "rich",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
ml = ["mlx-lm>=0.22.0"]

[project.scripts]
timekit = "timekit_engine.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/timekit_engine"]