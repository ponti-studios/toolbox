[package]
name = "netdebug"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Network debugging CLI with animated diagnostics"
readme = "README.md"
keywords = ["cli", "network", "debug", "diagnostics"]
categories = ["command-line-utilities"]

[[bin]]
name = "netdebug"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }
anyhow = { workspace = true }
indicatif = "0.17"
console = "0.15"
