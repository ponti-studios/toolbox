[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datpiff"
version = "0.1.0"
description = "Typer CLI for crawling Internet Archive DatPiff collection listings"
requires-python = ">=3.11"
dependencies = [
    "internetarchive",
    "rich",
    "typer",
]

[project.scripts]
datpiff = "datpiff.cli:app"
