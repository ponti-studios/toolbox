[package]
name = "filekit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Filekit CLI - frontmatter and file utilities toolkit"
readme = "README.md"
keywords = ["cli", "frontmatter", "utilities"]
categories = ["command-line-utilities"]

[[bin]]
name = "filekit"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = "2"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = { workspace = true }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
dirs = "5"
regex = "1"
csv = "1"
clap_complete = "4"
calamine = "0.31"
files = { workspace = true }

[dev-dependencies]
tempfile = "3"
