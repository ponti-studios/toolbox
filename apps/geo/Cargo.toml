[package]
name = "geo"
version = "0.1.0"
edition.workspace = true
default-run = "geo"
description = "CLI tool for geolocation lookups and CSV geocoding via OpenStreetMap Nominatim"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cli", "geocoding", "csv", "nominatim"]
categories = ["command-line-utilities", "data-structures"]
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { workspace = true }
csv = "1.2"
urlencoding = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "2"
tempfile = "3"
httpmock = "0.8"
serde_json = "1"
