name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  prepare-matrix:
    name: Prepare CLI Matrices
    runs-on: ubuntu-latest
    outputs:
      unit_matrix: ${{ steps.matrix.outputs.unit_matrix }}
      smoke_matrix: ${{ steps.matrix.outputs.smoke_matrix }}
      integration_matrix: ${{ steps.matrix.outputs.integration_matrix }}
      release_smoke_matrix: ${{ steps.matrix.outputs.release_smoke_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build manifest matrices
        id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("tooling/cli-test-manifest.json").read_text())
          tools = manifest["tools"]

          def matrix_for(field):
              include = []
              for tool in tools:
                  if tool.get(field):
                      include.append(
                          {
                              "name": tool["name"],
                              "language": tool["language"],
                              "os": tool["os"],
                              "path": tool["path"],
                          }
                      )
              return json.dumps({"include": include})

          print(f"unit_matrix={matrix_for('unit_command')}")
          print(f"smoke_matrix={matrix_for('smoke_command')}")
          print(f"integration_matrix={matrix_for('integration_command')}")
          print(f"release_smoke_matrix={matrix_for('release_smoke_command')}")
          PY

  unit:
    name: Unit ${{ matrix.name }}
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.unit_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: |
            apps/xkit/go.sum
            apps/careerkit/go.mod

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Set up Bun
        if: matrix.language == 'bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install imagekit system tools
        if: matrix.language == 'bun'
        run: brew install exiftool imagemagick libavif webp

      - name: Run unit phase
        run: ./scripts/test-clis.sh --phase unit --tool "${{ matrix.name }}"

  smoke:
    name: Smoke ${{ matrix.name }}
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.smoke_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: |
            apps/xkit/go.sum
            apps/careerkit/go.mod

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Set up Bun
        if: matrix.language == 'bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install imagekit system tools
        if: matrix.language == 'bun'
        run: brew install exiftool imagemagick libavif webp

      - name: Run smoke phase
        run: ./scripts/test-clis.sh --phase smoke --tool "${{ matrix.name }}"

  integration:
    name: Integration ${{ matrix.name }}
    needs: [prepare-matrix, unit, smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.integration_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: |
            apps/xkit/go.sum
            apps/careerkit/go.mod

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Set up Bun
        if: matrix.language == 'bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install imagekit system tools
        if: matrix.language == 'bun'
        run: brew install exiftool imagemagick libavif webp

      - name: Run integration phase
        run: ./scripts/test-clis.sh --phase integration --tool "${{ matrix.name }}"

  release-smoke:
    name: Release Smoke ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.release_smoke_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: |
            apps/xkit/go.sum
            apps/careerkit/go.mod

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Set up Bun
        if: matrix.language == 'bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install imagekit system tools
        if: matrix.language == 'bun'
        run: brew install exiftool imagemagick libavif webp

      - name: Run release-smoke phase
        run: ./scripts/test-clis.sh --phase release-smoke --tool "${{ matrix.name }}"
