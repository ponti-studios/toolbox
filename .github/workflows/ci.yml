name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-matrix:
    name: Prepare CLI Matrices
    runs-on: ubuntu-latest
    outputs:
      unit_matrix: ${{ steps.matrix.outputs.unit_matrix }}
      smoke_matrix: ${{ steps.matrix.outputs.smoke_matrix }}
      integration_matrix: ${{ steps.matrix.outputs.integration_matrix }}
      release_smoke_matrix: ${{ steps.matrix.outputs.release_smoke_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Build manifest matrices
        id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("tooling/cli-test-manifest.json").read_text())
          tools = manifest["tools"]

          def matrix_for(field):
              include = []
              for tool in tools:
                  if tool.get(field):
                      include.append(
                          {
                              "name": tool["name"],
                              "language": tool["language"],
                              "os": tool["os"],
                              "path": tool["path"],
                          }
                      )
              return json.dumps({"include": include})

          print(f"unit_matrix={matrix_for('unit_command')}")
          print(f"smoke_matrix={matrix_for('smoke_command')}")
          print(f"integration_matrix={matrix_for('integration_command')}")
          print(f"release_smoke_matrix={matrix_for('release_smoke_command')}")
          PY

  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    name: Unit ${{ matrix.name }}
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.unit_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2.9.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: |
            apps/xkit/go.sum
            apps/careerkit/go.mod

      - name: Run unit phase
        run: ./scripts/test-clis.sh --phase unit --tool "${{ matrix.name }}"

  smoke:
    name: Smoke ${{ matrix.name }}
    needs: [prepare-matrix, rust-quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.smoke_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2.9.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: |
            apps/xkit/go.sum
            apps/careerkit/go.mod

      - name: Run smoke phase
        run: ./scripts/test-clis.sh --phase smoke --tool "${{ matrix.name }}"

  integration:
    name: Integration ${{ matrix.name }}
    needs: [prepare-matrix, unit, smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.integration_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2.9.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: |
            apps/xkit/go.sum
            apps/careerkit/go.mod

      - name: Run integration phase
        run: ./scripts/test-clis.sh --phase integration --tool "${{ matrix.name }}"

  release-smoke:
    name: Release Smoke ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.release_smoke_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2.9.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: |
            apps/xkit/go.sum
            apps/careerkit/go.mod

      - name: Run release-smoke phase
        run: ./scripts/test-clis.sh --phase release-smoke --tool "${{ matrix.name }}"
