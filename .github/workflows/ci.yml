name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Smoke test Rust binaries
        run: just smoke

  geokit:
    name: Geokit (Swift CLI)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build geokit
        run: cd apps/geokit && swift build

      - name: Run geokit tests
        run: cd apps/geokit && swift test

      - name: Smoke test geokit CLI
        run: cd apps/geokit && swift run geokit -- --help

  timekit:
    name: Timekit (Swift CLI)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build timekit
        run: cd apps/timekit && swift build

      - name: Smoke test timekit CLI
        run: cd apps/timekit && swift run timekit -- --help

  essay-classifier:
    name: Essay Classifier (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build essay-classifier
        working-directory: apps/essay-classifier
        run: go build -o essay-classifier ./cmd

      - name: Smoke test essay-classifier
        working-directory: apps/essay-classifier
        run: ./essay-classifier --help
