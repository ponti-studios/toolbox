name: Publish Iconkit (compat)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/iconkit/package.json"
  workflow_dispatch:

jobs:
  publish:
    name: Publish compat to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@11

      - name: Check if version already published
        id: check
        run: |
          PACKAGE_NAME=$(node -p "require('./apps/iconkit/package.json').name")
          VERSION=$(node -p "require('./apps/iconkit/package.json').version")
          if npm view $PACKAGE_NAME@$VERSION version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME version $VERSION already published — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME version $VERSION not yet published."
          fi

      - name: Validate package
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/iconkit
        run: npm pack --dry-run

      - name: Publish compat
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/iconkit
        run: npm publish --provenance --access public

      - name: Deprecate package
        if: steps.check.outputs.exists == 'false'
        run: |
          PACKAGE_NAME=$(node -p "require('./apps/iconkit/package.json').name")
          VERSION=$(node -p "require('./apps/iconkit/package.json').version")
          npm deprecate "$PACKAGE_NAME@$VERSION" "iconkit is deprecated — use @ponti-studios/imagekit. iconkit remains as a binary alias: npm install -g @ponti-studios/imagekit" || echo "deprecate failed (may already be deprecated)"
