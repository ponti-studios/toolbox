name: Release

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PACKAGE="${TAG%-v*}"
          VERSION="${TAG#*-v}"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.target }}
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        if: needs.prepare.outputs.package != 'geokit'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: needs.prepare.outputs.package != 'geokit'
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (Rust)
        if: needs.prepare.outputs.package != 'geokit'
        run: cargo build -p ${{ needs.prepare.outputs.package }} --release --target ${{ matrix.target }}

      - name: Build release binary (geokit Swift)
        if: needs.prepare.outputs.package == 'geokit'
        run: cd apps/geokit && swift build -c release

      - name: Archive release binary (Rust)
        if: needs.prepare.outputs.package != 'geokit'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ needs.prepare.outputs.package }}-${{ matrix.target }}.tar.gz ${{ needs.prepare.outputs.package }}

      - name: Archive release binary (geokit Swift)
        if: needs.prepare.outputs.package == 'geokit'
        run: tar -C apps/geokit/.build/release -czf geokit-${{ matrix.target }}.tar.gz geokit

      - name: Generate checksum
        run: shasum -a 256 ${{ needs.prepare.outputs.package }}-${{ matrix.target }}.tar.gz > ${{ needs.prepare.outputs.package }}-${{ matrix.target }}.tar.gz.sha256

      - name: Upload GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ needs.prepare.outputs.package }}-${{ matrix.target }}.tar.gz
            ${{ needs.prepare.outputs.package }}-${{ matrix.target }}.tar.gz.sha256
