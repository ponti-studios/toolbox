name: Publish Filekit

on:
  push:
    branches: [main]
    paths:
      - "apps/filekit/package.json"
      - "apps/filekit/package-lock.json"
      - "apps/filekit/src/**"
      - ".github/workflows/publish-filekit.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: apps/filekit/package-lock.json
      - name: Install npm 11
        run: npm install --global npm@11
      - name: Check published version
        id: check
        working-directory: apps/filekit
        run: |
          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/filekit
        run: npm ci
      - name: Validate package
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/filekit
        run: npm run typecheck && npm test && npm run build && npm pack --dry-run
      - name: Publish
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/filekit
        run: npm publish --provenance --access public
