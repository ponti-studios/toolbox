name: Publish Monotone

on:
  push:
    branches: [main, master]
    paths:
      - "apps/monotone/package.json"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@11

      - name: Check if version already published
        id: check
        run: |
          PACKAGE_NAME=$(node -p "require('./apps/monotone/package.json').name")
          VERSION=$(node -p "require('./apps/monotone/package.json').version")
          if npm view $PACKAGE_NAME@$VERSION version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME version $VERSION already published — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME version $VERSION not yet published."
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/monotone
        run: bun install

      - name: Build
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/monotone
        run: bun run build

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/monotone
        run: npm publish --provenance --access public
