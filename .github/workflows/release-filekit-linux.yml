name: Release Filekit Linux binary

on:
  push:
    tags:
      - 'filekit-v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Filekit
        run: cargo build -p filekit --release --target "$TARGET"

      - name: Archive binary
        run: tar -C "target/$TARGET/release" -czf "filekit-$TARGET.tar.gz" filekit

      - name: Generate checksum
        run: sha256sum "filekit-$TARGET.tar.gz" > "filekit-$TARGET.tar.gz.sha256"

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            filekit-${{ env.TARGET }}.tar.gz
            filekit-${{ env.TARGET }}.tar.gz.sha256
